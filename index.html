<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17654f">
  <title>Aurora 식사 신청</title>
  <style>
    :root{font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#203142;background:#f4f6f8;font-size:15px;line-height:1.5}
    *{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 16px 36px}h1{font-size:24px;margin:2px 0;font-weight:600}h2{font-size:19px;margin:22px 0 10px}p{margin:8px 0}button,input,select{font:inherit}button{min-height:44px;border:1px solid #cbd5de;border-radius:8px;padding:9px 14px;background:#fff;color:#203142;cursor:pointer}button:hover{background:#edf2f5}button:disabled{opacity:.55;cursor:not-allowed}input,select{width:100%;min-height:44px;border:1px solid #cbd5de;border-radius:8px;padding:9px;background:#fff;color:#203142;font-size:16px}input:disabled,select:disabled{background:#edf1f4;color:#536575}label{display:block}label>input,label>select{margin-top:5px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.brand{font-size:12px;letter-spacing:1px;color:#17654f;font-weight:600}.muted{color:#566978;font-size:13px}.notice{background:#edf5f1;border:1px solid #c8e0d5;border-radius:10px;padding:12px;margin:16px 0}.notice.error{background:#fff0ed;color:#872719;border-color:#eac9c3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.week{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0;font-weight:600}.week button{padding:8px 12px}.day{border:1px solid #d9e1e7;background:#fff;border-radius:10px;margin:10px 0}.day summary{cursor:pointer;padding:14px;font-weight:600;min-height:48px}.meals{padding:0 14px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.meal-title{display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap}.deadline{font-size:12px;color:#566978;margin-top:4px}.closed{color:#8c452b;font-size:12px}.primary{background:#17654f;color:#fff;border-color:#17654f}.primary:hover{background:#12513f}.wide{width:100%;margin-top:16px}.danger{color:#a22d22}.panel{background:#fff;border:1px solid #d9e1e7;padding:16px;border-radius:10px}.totals{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:16px}.totals strong{font-size:24px;font-weight:600}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:11px 7px;text-align:left;border-bottom:1px solid #e0e6eb}th{font-weight:600;color:#566978}.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.empty{padding:20px;text-align:center;color:#566978}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.tools input{flex:1;min-width:160px}.record{margin:10px 0;padding:12px;border:1px solid #d9e1e7;border-radius:8px;background:#fff}.record p{font-size:14px}dialog{max-width:430px;width:calc(100% - 32px);border:1px solid #cbd5de;border-radius:12px;padding:20px;color:#203142}dialog::backdrop{background:rgba(20,32,43,.4)}dialog .grid{margin-top:16px}dialog label{margin:12px 0}[hidden]{display:none!important}footer{margin-top:24px;text-align:center}.status{min-height:24px;margin:12px 0;color:#17654f}.status.error{color:#a22d22}a{color:#17654f}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #78b8a2;outline-offset:2px}
    @media(max-width:540px){main{padding:16px 12px}.meals{grid-template-columns:1fr}.meal-title{align-items:center}h1{font-size:22px}.week{font-size:14px}th,td{padding:10px 5px;font-size:13px}.grid{gap:10px}}
  </style>
</head>
<body>
<main>
  <header><div><div class="brand">AURORA PROJECT</div><h1 id="page-title">식사 신청</h1></div><button id="mode-button" type="button">관리자</button></header>
  <div id="connection" class="notice" role="status">Firebase 연결을 준비하고 있습니다.</div>
  <div id="employee-view">
    <div class="grid"><label>사번<input id="employee-id" autocomplete="username" maxlength="30" placeholder="사번 입력"></label><label>이름<input id="employee-name" autocomplete="name" maxlength="40" placeholder="이름 입력"></label></div>
    <div class="tools"><button id="load-orders" type="button" disabled>내 신청 불러오기</button><span class="muted">신청 후에는 같은 브라우저에서 수정해주세요.</span></div>
    <div class="week"><button id="prev-week" aria-label="이전 주" type="button">‹</button><span id="week-label"></span><button id="next-week" aria-label="다음 주" type="button">›</button></div>
    <div id="days"></div>
    <button id="submit-orders" class="primary wide" type="button" disabled>신청 제출</button>
    <p class="status" id="employee-status" aria-live="polite"></p>
    <p class="muted">중식: 당일 09:00 / 석식: 당일 13:00 / 조식: 전날 13:00 마감 · 한국시간 기준</p>
  </div>
  <div id="admin-view" hidden>
    <div class="row"><label>조회 날짜<input id="admin-date" type="date"></label><button id="admin-refresh" type="button">새로고침</button><button id="admin-logout" type="button">로그아웃</button></div>
    <div class="panel totals"><div><div class="muted">총 신청 수량</div><strong id="total-count">0개</strong></div><div><div class="muted">총 금액 · 부가세 포함</div><strong id="total-amount">0원</strong></div></div>
    <h2>식사·메뉴별 집계</h2>
    <div class="table-wrap"><table><thead><tr><th>식사 / 메뉴</th><th class="num">수량</th><th class="num">단가</th><th class="num">금액</th></tr></thead><tbody id="summary-body"></tbody></table></div>
    <h2>직원별 신청 내역</h2>
    <div class="tools"><input id="employee-filter" placeholder="이름 또는 사번 검색" aria-label="직원 검색"><button id="reset-all" class="danger" type="button">전체 초기화</button></div>
    <div id="admin-records"></div><p class="status" id="admin-status" aria-live="polite"></p>
  </div>
  <footer class="muted">Aurora Project · 식사 신청</footer>
</main>
<dialog id="login-dialog"><form id="login-form"><h2 style="margin-top:0">관리자 로그인</h2><label>이메일<input id="admin-email" type="email" autocomplete="username" required></label><label>비밀번호<input id="admin-password" type="password" autocomplete="current-password" required></label><p class="status" id="login-status" aria-live="polite"></p><div class="grid"><button id="login-cancel" type="button">취소</button><button id="login-submit" class="primary" type="submit">로그인</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 style="margin-top:0">확인</h2><p id="confirm-text"></p><div class="grid"><button id="confirm-cancel" type="button">취소</button><button id="confirm-ok" class="primary" type="button">확인</button></div></dialog>
<script type="module">
// Firebase 콘솔 > 프로젝트 설정 > 내 앱 > 웹 앱의 firebaseConfig 값을 붙여넣으세요.
// 아래 값은 웹 앱용 설정입니다. 관리자 비밀번호나 서비스 계정 키를 넣지 마세요.
const firebaseConfig = {
  apiKey: "AIzaSyCjApU9C_w1LEmQEvRqUsjI5MyILAvE4Vc",
  authDomain: "meal-order-9a8d1.firebaseapp.com",
  projectId: "meal-order-9a8d1",
  storageBucket: "meal-order-9a8d1.firebasestorage.app",
  messagingSenderId: "288830614630",
  appId: "1:288830614630:web:bad7a2d8c8e8a9bcf451a7",
  measurementId: "G-EMZW4X4XYP"
};

const $ = id => document.getElementById(id);
const MENUS = ['샐러드(닭가슴살)','샐러드(오리훈제)','샐러드(치킨텐더)','샌드위치(매쉬포테이토)','샌드위치(치킨텐더)','볶음밥(김치)','볶음밥(중국식)','백반'];
const MEALS = [{key:'breakfast',label:'조식'},{key:'lunch',label:'중식'},{key:'dinner',label:'석식'}];
const NONE = '신청 안 함';
const DAY_MS = 86400000;
const state = {ready:false,busy:false,week:'',owner:'',orders:[],adminOrders:[],admin:false,api:null,auth:null,db:null,adminAuth:null,adminDb:null,confirm:null};
const money = value => value.toLocaleString('ko-KR');
const price = menu => menu === '백반' ? 8000 : 9000;
function todayKST(now=Date.now()){return new Date(now + 9*3600000).toISOString().slice(0,10);}
function addDays(date,n){return new Date(Date.parse(date+'T00:00:00Z')+n*DAY_MS).toISOString().slice(0,10);}
function monday(date){const d=new Date(date+'T00:00:00Z').getUTCDay();return addDays(date,d===0?1:1-d);}
function deadline(date,meal){return Date.parse(date+'T00:00:00+09:00')+(meal==='breakfast'?-11:meal==='lunch'?9:13)*3600000;}
function dateLabel(date){const d=new Date(date+'T00:00:00Z');return `${d.getUTCMonth()+1}/${d.getUTCDate()} (${'일월화수목금토'[d.getUTCDay()]})`;}
function message(id,text,error=false){$(id).textContent=text;$(id).classList.toggle('error',error);}
function connection(text,error=false){$('connection').textContent=text;$('connection').classList.toggle('error',error);}
function textNode(tag,text,parent,className=''){const n=document.createElement(tag);n.textContent=text;if(className)n.className=className;if(parent)parent.append(n);return n;}
function readLocal(key){try{return localStorage.getItem(key)||'';}catch{return '';}}
function writeLocal(key,value){try{localStorage.setItem(key,value);}catch{/* 로컬 정보 저장 실패 시에도 Firebase 저장은 유지 */}}
function errorText(error){
  const code=error?.code||'';
  if(code.includes('permission-denied'))return '권한 또는 마감 시간 때문에 저장할 수 없습니다. 다른 기기로 이미 신청했다면 기존 기기에서 수정하거나 관리자에게 요청해주세요.';
  if(code.includes('invalid-credential')||code.includes('wrong-password')||code.includes('user-not-found'))return '이메일 또는 비밀번호를 확인해주세요.';
  if(code.includes('operation-not-allowed'))return 'Firebase Authentication의 익명 및 이메일/비밀번호 로그인을 활성화해주세요.';
  if(code.includes('unauthorized-domain'))return 'Firebase Authentication의 승인된 도메인에 GitHub Pages 도메인을 추가해주세요.';
  if(code.includes('network')||code.includes('unavailable'))return '인터넷 연결을 확인한 후 다시 시도해주세요.';
  if(code.includes('too-many-requests'))return '요청이 많습니다. 잠시 후 다시 시도해주세요.';
  return '처리하지 못했습니다. Firebase 설정과 연결을 확인해주세요. ('+(code||'연결 오류')+')';
}
function setBusy(busy){state.busy=busy;$('submit-orders').disabled=busy||!state.ready;$('load-orders').disabled=busy||!state.ready;['prev-week','next-week','mode-button','admin-refresh','reset-all','admin-logout','admin-date','employee-id','employee-name'].forEach(id=>$(id).disabled=busy);document.querySelectorAll('#admin-records button').forEach(button=>button.disabled=busy);document.querySelectorAll('#days select').forEach(select=>select.disabled=busy||Date.now()>deadline(select.dataset.date,select.dataset.meal));}
function renderWeek(){
  $('week-label').textContent=dateLabel(state.week)+' – '+dateLabel(addDays(state.week,5));$('days').replaceChildren();
  const emp=$('employee-id').value.trim();
  for(let i=0;i<6;i++){
    const date=addDays(state.week,i);const details=document.createElement('details');details.className='day';details.open=i===0;const summary=textNode('summary',dateLabel(date),details);summary.setAttribute('aria-label',date+' 식사 선택');const body=document.createElement('div');body.className='meals';
    MEALS.forEach(meal=>{
      const label=document.createElement('label');const title=document.createElement('div');title.className='meal-title';textNode('span',meal.label,title);const closed=Date.now()>deadline(date,meal.key);if(closed)textNode('span','마감',title,'closed');label.append(title);
      const select=document.createElement('select');select.dataset.date=date;select.dataset.meal=meal.key;select.setAttribute('aria-label',date+' '+meal.label+' 메뉴');const options=[NONE,...(meal.key==='breakfast'?['백반']:meal.key==='dinner'?MENUS.filter(x=>x!=='백반'):MENUS)];options.forEach(menu=>{const option=document.createElement('option');option.value=menu;option.textContent=menu;select.append(option);});
      const existing=state.orders.find(o=>o.date===date&&o.meal===meal.key&&o.empId===emp);select.value=existing?.menu||NONE;select.disabled=closed;label.append(select);textNode('div',meal.key==='breakfast'?'전날 13:00 마감':meal.key==='lunch'?'당일 09:00 마감':'당일 13:00 마감',label,'deadline');body.append(label);
    });details.append(body);$('days').append(details);
  }
}
function refreshDeadlines(){document.querySelectorAll('#days select').forEach(select=>{if(!select.disabled&&Date.now()>deadline(select.dataset.date,select.dataset.meal)){select.disabled=true;const title=select.parentElement.querySelector('.meal-title');textNode('span','마감',title,'closed');}});}
function lockIdentity(){const ids=[...new Set(state.orders.map(o=>o.empId))];if(ids.length===1){$('employee-id').value=ids[0];$('employee-id').readOnly=true;$('employee-name').value=state.orders[0].name;}else $('employee-id').readOnly=false;}
async function loadMine(){
  if(!state.ready)return;setBusy(true);try{const api=state.api;const result=await api.getDocs(api.query(api.collection(state.db,'orders'),api.where('owner','==',state.owner)));state.orders=result.docs.map(d=>({id:d.id,...d.data()}));lockIdentity();renderWeek();message('employee-status',state.orders.length?'기존 신청 내역을 불러왔습니다.':'저장된 신청 내역이 없습니다.');}catch(e){message('employee-status',errorText(e),true);}finally{setBusy(false);}
}
async function submitOrders(){
  if(!state.ready||state.busy)return;const empId=$('employee-id').value.trim(),name=$('employee-name').value.trim();if(!/^[A-Za-z0-9-]{1,30}$/.test(empId)){message('employee-status','사번은 영문·숫자·하이픈으로 입력해주세요.',true);return;}if(!name){message('employee-status','이름을 입력해주세요.',true);return;}
  const changed=[];document.querySelectorAll('#days select').forEach(select=>{const date=select.dataset.date,meal=select.dataset.meal,menu=select.value;if(Date.now()>deadline(date,meal))return;const old=state.orders.find(o=>o.empId===empId&&o.date===date&&o.meal===meal);if(menu!==(old?.menu||NONE)||(old&&old.name!==name))changed.push({date,meal,menu});});
  if(!changed.length){message('employee-status','변경된 신청 내용이 없습니다.');return;}
  setBusy(true);try{
    const api=state.api;const batch=api.writeBatch(state.db);
    changed.forEach(({date,meal,menu})=>{const [year,month,day]=date.split('-').map(Number);batch.set(api.doc(state.db,'orders',`${empId}_${date}_${meal}`),{owner:state.owner,empId,name,date,year,month,day,meal,menu,updatedAt:api.serverTimestamp()});});
    await batch.commit();writeLocal('aurora.empId',empId);writeLocal('aurora.name',name);await loadMine();message('employee-status',`${changed.length}건의 신청 변경을 저장했습니다.`);
  }catch(e){message('employee-status',errorText(e),true);}finally{setBusy(false);refreshDeadlines();}
}
function showEmployee(){state.admin=false;$('employee-view').hidden=false;$('admin-view').hidden=true;$('page-title').textContent='식사 신청';$('mode-button').textContent='관리자';}
async function openAdmin(){
  if(state.admin){showEmployee();return;}if(!state.ready){connection('Firebase 설정을 완료하면 관리자 로그인을 사용할 수 있습니다.',true);return;}
  if(state.adminAuth.currentUser){await enterAdmin();return;}message('login-status','');$('login-dialog').showModal();
}
async function enterAdmin(){
  try{const api=state.api,user=state.adminAuth.currentUser;if(!user)return;const admin=await api.getDoc(api.doc(state.adminDb,'admins',user.uid));if(!admin.exists()||admin.data().enabled!==true){await api.signOut(state.adminAuth);message('login-status','관리자 권한이 없습니다. admins 컬렉션의 UID와 enabled 값을 확인해주세요.',true);return;}
    $('login-dialog').close();state.admin=true;$('employee-view').hidden=true;$('admin-view').hidden=false;$('page-title').textContent='식사 신청 관리';$('mode-button').textContent='직원 화면';await refreshAdmin();
  }catch(e){message('login-status',errorText(e),true);message('employee-status',errorText(e),true);}
}
async function refreshAdmin(){
  if(!state.admin)return;setBusy(true);message('admin-status','조회 중…');try{const api=state.api;const docs=await api.getDocs(api.query(api.collection(state.adminDb,'orders'),api.where('date','==',$('admin-date').value)));state.adminOrders=docs.docs.map(d=>({id:d.id,...d.data()}));renderAdmin();message('admin-status','최신 내역을 불러왔습니다.');}catch(e){message('admin-status',errorText(e),true);}finally{setBusy(false);}
}
function renderAdmin(){
  const groups=new Map();let count=0,amount=0;state.adminOrders.forEach(o=>{if(o.menu===NONE)return;const key=o.meal+'|'+o.menu;groups.set(key,(groups.get(key)||0)+1);count++;amount+=price(o.menu);});$('total-count').textContent=count+'개';$('total-amount').textContent=money(amount)+'원';$('summary-body').replaceChildren();
  MEALS.forEach(meal=>{
    let subCount=0,subAmount=0;
    MENUS.forEach(menu=>{const n=groups.get(meal.key+'|'+menu)||0;if(!n)return;const tr=document.createElement('tr');textNode('td',meal.label+' · '+menu,tr);[n,money(price(menu)),money(n*price(menu))].forEach(v=>textNode('td',String(v),tr,'num'));$('summary-body').append(tr);subCount+=n;subAmount+=n*price(menu);});
    if(subCount){const tr=document.createElement('tr');textNode('th',meal.label+' 합계',tr);textNode('th',String(subCount),tr,'num');textNode('th','—',tr,'num');textNode('th',money(subAmount),tr,'num');$('summary-body').append(tr);}
  });
  if(!count){const tr=document.createElement('tr');const td=textNode('td','신청 내역이 없습니다.',tr,'empty');td.colSpan=4;$('summary-body').append(tr);}
  renderPeople();
}
function renderPeople(){
  const filter=$('employee-filter').value.trim().toLowerCase();const people=new Map();state.adminOrders.forEach(o=>{if(filter&&!(o.name+' '+o.empId).toLowerCase().includes(filter))return;const key=o.empId;if(!people.has(key))people.set(key,[]);people.get(key).push(o);});$('admin-records').replaceChildren();
  [...people.values()].sort((a,b)=>a[0].name.localeCompare(b[0].name,'ko')).forEach(orders=>{const record=document.createElement('div');record.className='record';const top=document.createElement('div');top.className='row';textNode('strong',orders[0].name+' · '+orders[0].empId,top);const button=textNode('button','개별 삭제',top);button.type='button';button.className='danger';button.disabled=state.busy;button.onclick=()=>ask(`${orders[0].name}님의 ${$('admin-date').value} 신청 전체를 삭제할까요?`,()=>deleteDocuments(orders.map(o=>o.id)));record.append(top);MEALS.forEach(meal=>{const o=orders.find(r=>r.meal===meal.key);textNode('p',meal.label+' · '+(o?.menu||NONE),record);});$('admin-records').append(record);});
  if(!people.size)textNode('p','조회된 직원이 없습니다.',$('admin-records'),'empty');
}
function ask(text,fn){if(state.busy)return;state.confirm=fn;$('confirm-text').textContent=text;$('confirm-dialog').showModal();}
async function deleteDocuments(ids){
  setBusy(true);let done=0;try{const api=state.api;for(let offset=0;offset<ids.length;offset+=400){const batch=api.writeBatch(state.adminDb);const chunk=ids.slice(offset,offset+400);chunk.forEach(id=>batch.delete(api.doc(state.adminDb,'orders',id)));await batch.commit();done+=chunk.length;}await refreshAdmin();message('admin-status',done+'건을 삭제했습니다.');}catch(e){message('admin-status',`${done}건 삭제 완료. 나머지 삭제 실패: `+errorText(e),true);}finally{setBusy(false);}
}
$('load-orders').onclick=loadMine;$('submit-orders').onclick=submitOrders;$('mode-button').onclick=openAdmin;
$('prev-week').onclick=()=>{state.week=addDays(state.week,-7);renderWeek();message('employee-status','');};$('next-week').onclick=()=>{state.week=addDays(state.week,7);renderWeek();message('employee-status','');};
$('admin-date').onchange=refreshAdmin;$('admin-refresh').onclick=refreshAdmin;$('employee-filter').oninput=renderPeople;
$('admin-logout').onclick=async()=>{if(state.busy)return;try{await state.api.signOut(state.adminAuth);state.adminOrders=[];showEmployee();message('employee-status','관리자 로그아웃 완료');}catch(e){message('admin-status',errorText(e),true);}};
$('login-cancel').onclick=()=>$('login-dialog').close();
$('login-form').onsubmit=async event=>{event.preventDefault();$('login-submit').disabled=true;message('login-status','로그인 중…');try{await state.api.signInWithEmailAndPassword(state.adminAuth,$('admin-email').value.trim(),$('admin-password').value);$('admin-password').value='';await enterAdmin();}catch(e){message('login-status',errorText(e),true);}finally{$('login-submit').disabled=false;}};
$('confirm-cancel').onclick=()=>{state.confirm=null;$('confirm-dialog').close();};$('confirm-ok').onclick=async()=>{const fn=state.confirm;state.confirm=null;$('confirm-dialog').close();if(fn)await fn();};
$('reset-all').onclick=()=>ask('모든 직원의 모든 날짜 신청을 삭제합니다. 복구할 수 없습니다. 계속할까요?',async()=>{setBusy(true);try{const api=state.api;const docs=await api.getDocs(api.collection(state.adminDb,'orders'));await deleteDocuments(docs.docs.map(d=>d.id));}catch(e){message('admin-status',errorText(e),true);}finally{setBusy(false);}});
$('employee-id').onchange=renderWeek;
state.week=monday(todayKST());$('admin-date').value=todayKST();$('employee-id').value=readLocal('aurora.empId');$('employee-name').value=readLocal('aurora.name');renderWeek();setInterval(refreshDeadlines,15000);
async function boot(){
  if(!firebaseConfig.apiKey||!firebaseConfig.projectId||!firebaseConfig.appId){connection('연결 전 미리보기입니다. index.html의 firebaseConfig를 입력하면 온라인 신청을 사용할 수 있습니다.');return;}
  try{
    const base='https://www.gstatic.com/firebasejs/12.19.0/';const [appApi,authApi,dbApi]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);state.api={...authApi,...dbApi};
    const app=appApi.initializeApp(firebaseConfig);state.auth=authApi.getAuth(app);state.db=dbApi.getFirestore(app);await authApi.setPersistence(state.auth,authApi.browserLocalPersistence);await state.auth.authStateReady();if(!state.auth.currentUser)await authApi.signInAnonymously(state.auth);state.owner=state.auth.currentUser.uid;
    const adminApp=appApi.initializeApp(firebaseConfig,'aurora-admin');state.adminAuth=authApi.getAuth(adminApp);await authApi.setPersistence(state.adminAuth,authApi.browserSessionPersistence);await state.adminAuth.authStateReady();state.adminDb=dbApi.getFirestore(adminApp);state.ready=true;setBusy(false);connection('온라인 연결 완료 · Firebase에 공동 저장됩니다.');await loadMine();
  }catch(e){state.ready=false;setBusy(false);connection(errorText(e),true);}
}
boot();
</script>
